name: VidKing Stream Extractor

on:
  # ── Manual trigger ───────────────────────────────────────────────────────────
  workflow_dispatch:

  # ── Scheduled: every 6 hours ─────────────────────────────────────────────────
  schedule:
    - cron: "0 */6 * * *"

  # ── Auto-run when tmdbids.txt is updated ─────────────────────────────────────
  push:
    paths:
      - "tmdbids.txt"

jobs:
  extract:
    name: Extract Streams from tmdbids.txt
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to commit results/ back to the repo

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Set up Python ─────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        run: pip install requests urllib3

      # ── 4. Show tmdbids.txt content ───────────────────────────────────────────
      - name: Show tmdbids.txt
        run: |
          echo "=== tmdbids.txt ==="
          cat tmdbids.txt
          echo "==================="
          echo "Total entries: $(grep -cE 'vidking|^[0-9]+$' tmdbids.txt || true)"

      # ── 5. Run extractor (reads tmdbids.txt automatically) ────────────────────
      - name: Run VidKing Extractor
        run: python vidking_extractor.py

      # ── 6. List generated result files ───────────────────────────────────────
      - name: List results
        if: always()
        run: |
          echo "=== Generated result files ==="
          ls -lh results/ 2>/dev/null || echo "(no results directory)"

      # ── 7. Write step summary ─────────────────────────────────────────────────
      - name: Write step summary
        if: always()
        run: |
          echo "## VidKing Extraction Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run triggered by:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -d results ] && [ "$(ls -A results/)" ]; then
            for f in results/*.json; do
              echo "### \`$f\`" >> $GITHUB_STEP_SUMMARY
              echo '```json' >> $GITHUB_STEP_SUMMARY
              cat "$f" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "No result files were generated." >> $GITHUB_STEP_SUMMARY
          fi

      # ── 8. Commit results JSON back to repo ───────────────────────────────────
      - name: Commit results to repository
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add results/
          git diff --cached --quiet && echo "No changes to commit." && exit 0

          COUNT=$(ls results/*.json 2>/dev/null | wc -l | tr -d ' ')
          git commit -m "chore: update stream results (${COUNT} file(s)) [skip ci]"
          git push
